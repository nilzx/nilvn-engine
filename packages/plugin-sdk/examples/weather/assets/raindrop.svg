<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 20">
  <!-- Used as a mask: only the alpha matters; the colour comes from the theme. -->
  <defs>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-opacity="0"/>
      <stop offset="1" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="1" y="0" width="2" height="20" rx="1" fill="url(#streak)"/>
</svg>
